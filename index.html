    <script>
      // Filter out benign browser extension errors and extension message timeouts
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (typeof reason === 'string' ? reason : (reason && reason.message) || '') + '';
        var stack = (reason && reason.stack) || '';
        if (
          msg.indexOf('chrome: call method') !== -1 ||
          msg.indexOf('chrome-extension://') !== -1 ||
          stack.indexOf('chrome-extension://') !== -1 ||
          msg.indexOf('popup-closed-by-user') !== -1 ||
          msg.indexOf('cancelled-popup-request') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });

      window.addEventListener('error', function (event) {
        var msg = (event.message || '') + '';
        var filename = (event.filename || '') + '';
        if (
          msg.indexOf('chrome: call method') !== -1 ||
          msg.indexOf('chrome-extension://') !== -1 ||
          filename.indexOf('chrome-extension://') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
